<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8ebf2" />
<title>Tera</title>
<style>
  :root{
    --bg:#e8ebf2; --light:#ffffff; --dark:#c3cbd9;
    --text:#39415a; --muted:#7c88a1;
    --accent:#6f80ff; --accent2:#8b9bff;
    --good:#38b981; --warn:#d99b2b; --bad:#e07070;
    --raised:8px 8px 18px var(--dark), -8px -8px 18px var(--light);
    --raised-sm:5px 5px 12px var(--dark), -5px -5px 12px var(--light);
    --raised-xs:3px 3px 7px var(--dark), -3px -3px 7px var(--light);
    --inset:inset 4px 4px 9px var(--dark), inset -4px -4px 9px var(--light);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); overscroll-behavior-y:none;
  }
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
    position:relative; z-index:20;
    box-shadow:0 6px 18px rgba(195,203,217,.55);
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; letter-spacing:.2px;}
  .dot{width:12px; height:12px; border-radius:50%;
       background:linear-gradient(135deg,var(--accent2),var(--accent));
       box-shadow:0 0 0 5px rgba(111,128,255,.14);}
  .icon-btn{
    width:44px; height:44px; border:0; border-radius:14px; background:var(--bg);
    color:var(--text); box-shadow:var(--raised-sm); font-size:17px; cursor:pointer;
    display:grid; place-items:center;
  }
  .icon-btn:active{box-shadow:var(--inset);}

  /* ---------- layout ---------- */
  .body{flex:1; display:flex; min-height:0; position:relative;}
  .chat{flex:1; overflow-y:auto; padding:18px 16px 10px; -webkit-overflow-scrolling:touch;}

  /* ---------- messages ---------- */
  .msg{display:flex; margin-bottom:14px; animation:rise .22s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .msg.me{justify-content:flex-end;}
  .col{max-width:84%;}
  .bubble{
    padding:12px 15px; border-radius:20px; font-size:15.5px;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .msg.tera .bubble{background:var(--bg); box-shadow:var(--raised-sm); border-bottom-left-radius:7px;}
  .msg.me .bubble{
    background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff;
    border-bottom-right-radius:7px; box-shadow:5px 5px 14px rgba(111,128,255,.42);
  }
  .chip{
    display:inline-block; margin-top:9px; font-size:12px; padding:5px 12px;
    border-radius:999px; background:var(--bg); box-shadow:var(--raised-xs); color:var(--muted);
  }
  .chip.stored{color:var(--good);} .chip.answered{color:var(--accent);}
  .chip.refused{color:var(--warn);} .chip.ungrounded{color:var(--bad);}
  .sources{margin-top:9px; font-size:12.5px; color:var(--muted);}
  .sources div{padding:3px 0;}

  /* ---------- hello ---------- */
  .hello{max-width:560px; margin:14px auto 0; text-align:center; padding:6px;}
  .hello h2{margin:6px 0 8px; font-size:22px;}
  .hello p{color:var(--muted); margin:0 0 18px; font-size:15px;}
  .examples{display:flex; flex-direction:column; gap:11px; align-items:center;}
  .ex{
    border:0; background:var(--bg); box-shadow:var(--raised-sm); color:var(--text);
    border-radius:16px; padding:13px 18px; font-size:14.5px; cursor:pointer;
    max-width:100%; font-family:inherit;
  }
  .ex:active{box-shadow:var(--inset);}

  /* ---------- composer ---------- */
  .composer{
    display:flex; gap:10px; align-items:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .composer input{
    flex:1; min-width:0; border:0; outline:none; background:var(--bg); color:var(--text);
    border-radius:18px; padding:14px 16px; font-size:16px; box-shadow:var(--inset);
    font-family:inherit;
  }
  .composer input::placeholder{color:#9aa4ba;}
  .send{
    width:52px; height:52px; flex:0 0 52px; border:0; border-radius:18px;
    background:linear-gradient(135deg,var(--accent2),var(--accent)); color:#fff;
    box-shadow:5px 5px 14px rgba(111,128,255,.45); cursor:pointer;
    display:grid; place-items:center;
  }
  .send:active{transform:translateY(1px);}
  .send:disabled{opacity:.55;}

  /* ---------- knowledge panel ---------- */
  .panel{
    position:fixed; top:0; right:0; height:100vh; height:100dvh;
    width:min(360px,88vw); background:var(--bg);
    box-shadow:-12px 0 34px rgba(150,160,185,.5);
    transform:translateX(103%); transition:transform .3s cubic-bezier(.4,0,.2,1);
    z-index:40; display:flex; flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .panel.open{transform:none;}
  .backdrop{
    position:fixed; inset:0; background:rgba(57,65,90,.3); opacity:0;
    pointer-events:none; transition:opacity .3s; z-index:30;
  }
  .backdrop.open{opacity:1; pointer-events:auto;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .panel-head strong{font-size:16px;}
  .storage{
    border-radius:15px; padding:11px 14px; font-size:13px; margin-bottom:15px;
    box-shadow:var(--raised-sm); line-height:1.45;
  }
  .storage.ok{color:var(--good);} .storage.warn{color:var(--warn);}
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:18px;}
  .stat{background:var(--bg); box-shadow:var(--raised-sm); border-radius:15px; padding:11px 13px;}
  .stat b{display:block; font-size:18px; line-height:1.2;}
  .stat span{font-size:11.5px; color:var(--muted);}
  .facts-head{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); margin-bottom:9px;
  }
  .ghost{border:0; background:none; color:var(--accent); font-size:12px; cursor:pointer; font-family:inherit;}
  .fact{background:var(--bg); box-shadow:var(--raised-sm); border-radius:15px; padding:11px 13px; margin-bottom:10px; font-size:13.5px;}
  .fact .meta{color:var(--muted); font-size:11px; margin-top:6px;}
  .tag{display:inline-block; padding:2px 8px; border-radius:999px; box-shadow:var(--raised-xs); font-size:10.5px;}

  /* ---------- desktop ---------- */
  @media (min-width:900px){
    .panel{
      position:static; transform:none; height:auto; width:340px; flex:0 0 340px;
      box-shadow:none; z-index:1; padding:22px 18px;
      border-left:1px solid rgba(195,203,217,.7);
    }
    .backdrop{display:none;}
    #menuBtn, #closeBtn{display:none;}
    .chat{padding:24px 22px;}
    .msg{margin-bottom:16px;}
    .hello{margin-top:40px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span> Tera</div>
    <button class="icon-btn" id="menuBtn" aria-label="Open knowledge base">☰</button>
  </header>

  <div class="body">
    <main class="chat" id="chat">
      <div class="hello">
        <h2>Hi, I&rsquo;m Tera.</h2>
        <p>Tell me something and I&rsquo;ll remember it forever &mdash; or ask me a question and I&rsquo;ll answer from what I know.</p>
        <div class="examples">
          <button class="ex" data-text="ISRO was founded in 1969.">ISRO was founded in 1969.</button>
          <button class="ex" data-text="When was ISRO founded?">When was ISRO founded?</button>
        </div>
      </div>
    </main>

    <aside class="panel" id="panel">
      <div class="panel-head">
        <strong>Knowledge base</strong>
        <button class="icon-btn" id="closeBtn" aria-label="Close">✕</button>
      </div>
      <div class="storage" id="storage"></div>
      <div class="stats" id="stats"></div>
      <div class="facts-head">
        <span>Stored facts</span>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <div id="facts"></div>
    </aside>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="input" placeholder="Message Tera…" autocomplete="off" />
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M13 6l6 6-6 6"/>
      </svg>
    </button>
  </form>
</div>
<div class="backdrop" id="backdrop"></div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const panel = document.getElementById('panel');
const backdrop = document.getElementById('backdrop');

/* panel open/close (mobile) */
function openPanel(){ panel.classList.add('open'); backdrop.classList.add('open'); }
function closePanel(){ panel.classList.remove('open'); backdrop.classList.remove('open'); }
document.getElementById('menuBtn').addEventListener('click', openPanel);
document.getElementById('closeBtn').addEventListener('click', closePanel);
backdrop.addEventListener('click', closePanel);

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function clearHello(){ const h = chat.querySelector('.hello'); if (h) h.remove(); }

function addMessage(who, text, opts = {}){
  clearHello();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (who === 'you' ? 'me' : 'tera');
  const col = document.createElement('div');
  col.className = 'col';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  col.appendChild(bubble);

  if (opts.chip){
    const chip = document.createElement('span');
    chip.className = 'chip ' + (opts.chipClass || '');
    chip.textContent = opts.chip;
    col.appendChild(chip);
  }
  if (opts.sources && opts.sources.length){
    const src = document.createElement('div');
    src.className = 'sources';
    opts.sources.forEach(s => {
      const d = document.createElement('div');
      d.textContent = '• ' + s;
      src.appendChild(d);
    });
    col.appendChild(src);
  }
  wrap.appendChild(col);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function renderStats(s){
  if (!s) return;
  const rows = [
    ['Facts', s.active_facts],
    ['Stored ever', s.total_facts],
    ['Reinforced', s.reinforced],
    ['Superseded', s.superseded],
    ['Rejected', s.rejected],
    ['Answered', s.queries],
  ];
  document.getElementById('stats').innerHTML = rows
    .map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
}

async function loadFacts(){
  try{
    const r = await fetch('/api/facts?limit=100');
    const facts = await r.json();
    const el = document.getElementById('facts');
    if (!facts.length){ el.innerHTML = '<div class="fact">Nothing stored yet.</div>'; return; }
    el.innerHTML = facts.map(f => `
      <div class="fact">${esc(f.content)}
        <div class="meta"><span class="tag">${esc(f.category)}</span>
          conf ${f.confidence}${f.reinforcements ? ' · reinforced ' + f.reinforcements + '×' : ''}
        </div>
      </div>`).join('');
  }catch(e){ /* ignore */ }
}

async function loadStats(){
  try{ renderStats(await (await fetch('/api/stats')).json()); }catch(e){ /* ignore */ }
}

async function loadHealth(){
  try{
    const h = await (await fetch('/api/health')).json();
    const el = document.getElementById('storage');
    if (h.persistent){
      el.className = 'storage ok';
      el.textContent = 'Storage: ' + h.store + ' — your knowledge base is saved permanently.';
    } else {
      el.className = 'storage warn';
      const seen = (h.redis_env && h.redis_env.length)
        ? ' Tera can see these variables: ' + h.redis_env.join(', ') + '.'
        : ' Tera can see no Redis variables at all.';
      el.textContent = 'Storage: not persistent — Tera will forget between visits.' + seen +
        ' Add a Redis database from the Vercel Storage tab, then redeploy.';
    }
  }catch(e){ /* ignore */ }
}

async function send(text){
  sendBtn.disabled = true;
  addMessage('you', text);
  try{
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    const d = await r.json();
    if (!r.ok){ addMessage('tera', d.error || 'Something went wrong.'); return; }

    if (d.kind === 'answered'){
      addMessage('tera', d.answer, {
        chip: d.grounded ? 'answered from knowledge base' : 'not in knowledge base yet',
        chipClass: d.grounded ? 'answered' : 'ungrounded',
        sources: d.grounded ? d.facts : null,
      });
    } else if (d.kind === 'stored'){
      const verb = d.action === 'reinforced' ? 'reinforced'
                 : d.action === 'superseded' ? 'updated (old kept)'
                 : 'stored';
      addMessage('tera', d.reply, {chip: verb, chipClass: 'stored'});
      loadFacts();
    } else {
      addMessage('tera', d.reply, {chip: 'not stored', chipClass: 'refused'});
    }
    renderStats(d.stats);
  }catch(err){
    addMessage('tera', 'Network error — is the server running?');
  }finally{
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
});

document.querySelectorAll('.ex').forEach(btn => {
  btn.addEventListener('click', () => send(btn.dataset.text));
});

document.getElementById('refresh').addEventListener('click', () => { loadFacts(); loadStats(); loadHealth(); });

loadHealth();
loadStats();
loadFacts();
</script>
</body>
</html>
